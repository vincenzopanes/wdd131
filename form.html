<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Vincenzo Panes">
    <meta name="description" content="A form for submitting product reviews, including ratings, features, and written feedback.">
    <title>Product Review</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <!-- JS -->
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <div>
                <label for="product-name">Product Name<span class="required">*</span></label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating<span class="required">*</span></legend>

                <div class="rating"> 
                    <input type="radio" name="stars" id="star-a" value="5" required> 
                    <label for="star-a" title="5 stars"></label> 
                    
                    <input type="radio" name="stars" id="star-b" value="4" /> 
                    <label for="star-b" title="4 stars"></label> 
                    
                    <input type="radio" name="stars" id="star-c" value="3" />
                    <label for="star-c" title="3 stars"></label> 

                    <input type="radio" name="stars" id="star-d" value="2" /> 
                    <label for="star-d" title="2 stars"></label> 

                    <input type="radio" name="stars" id="star-e" value="1" /> 
                    <label for="star-e" title="1 star"></label> 
                </div>
            </fieldset>

            <!-- Date Installation -->
            <div class="install-date">
                <label for="installDate">Date of Installation<span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="features">
                <legend>Useful Features</legend>

                <input type="checkbox" id="feature1" name="features" value="Durability">
                <label for="feature1">Durability</label>

                <input type="checkbox" id="feature2" name="features" value="Performance">
                <label for="feature2">Performance</label>

                <input type="checkbox" id="feature2.1" name="features" value="Ease of Use">
                <label for="feature21">Ease of Use</label>

                <input type="checkbox" id="feature3" name="features" value="Design">
                <label for="feature3">Design</label>
            </fieldset>

            <!-- Written Review -->
            <div class="review">
                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="5"></textarea>
            </div>

            <!-- User Name -->
            <div class="user-name">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" name="userName">
            </div>

            <!-- Submit Button -->
            <div class="submit">
                <input type="submit" value="Submit Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> Vincenzo Panes | Chile</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
