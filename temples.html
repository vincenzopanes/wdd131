<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description" content="A collection of images of temples from around the world, showcasing their beauty and diversity.">
    <meta name="author" content="Vincenzo Panes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <!-- JS -->
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h2>Temple Album</h2>

        <button id="menu-button">☰</button>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Home</h1>
        <div class="gallery">
            <figure class="temple-card">
                <img src="images/concepcion-chile-temple.jpg" alt="Concepción Chile Temple" loading="lazy">
                <figcaption>Concepción Chile Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/roma-temple.jpg" alt="Rome Italy Temple" width="300" height="200" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/anchorage-alaska-temple.jpg" alt="Anchorage Alaska Temple" width="300" height="200" loading="lazy">
                <figcaption>Anchorage Alaska Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/mexico-city-temple.jpg" alt="Mexico City Temple" width="300" height="200" loading="lazy">
                <figcaption>Mexico City Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/bern-switzerland-temple.jpg" alt="Bern Switzerland Temple" width="300" height="200" loading="lazy">
                <figcaption>Bern Switzerland Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/san-diego-temple.jpg" alt="San Diego California Temple" width="300" height="200" loading="lazy">
                <figcaption>San Diego California Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/preston-england-temple.jpg" alt="Preston England Temple" width="300" height="200" loading="lazy">
                <figcaption>Preston England Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/aba-nigeria-temple.jpg" alt="Aba Nigeria Temple" width="300" height="200" loading="lazy">
                <figcaption>Aba Nigeria Temple</figcaption>
            </figure>
            <figure class="temple-card">
                <img src="images/buenos-aires-temple.jpg" alt="Buenos Aires Argentina Temple" width="300" height="200" loading="lazy">
                <figcaption>Buenos Aires Argentina Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentYear"></span> 🗡 Vincenzo Panes 🗡 Chile.
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
