<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <!-- CSS -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <!-- JS -->
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>

        <button id="menu-button">☰</button>

                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Home</h1>
        <figure class="temple-card">
            <figcaption>Concepción Chile Temple</figcaption>

        </figure>
        <figure class="temple-card">
            <figcaption>Rome Italy Temple</figcaption>
            <img src="images/roma-temple.png" alt="Rome Italy Temple" width="300" height="200">
        </figure>
        <figure class="temple-card">
            <figcaption>Anchorage Alaska Temple</figcaption>
            <img src="images/anchorage-alaska-temple.jpg" alt="Anchorage Alaska Temple" width="300" height="200">
        </figure>
        <figure class="temple-card">
            <figcaption>Mexico City Temple</figcaption>
            <img src="images/mexico-city-temple.jpg" alt="Mexico City Temple" width="300" height="200">

            <figcaption>Preston England Temple</figcaption>

        </figure>
        <figure class="temple-card">
            <figcaption>Aba Nigeria Temple</figcaption>

        </figure>

            <figcaption>Buenos Aires Argentina Temple</figcaption>

        </figure>
    </main>

    <footer>
        <p>
            &copy; <span id="currentYear"></span> 🗡 Vincenzo Panes 🗡 Chile.
        </p>
        <p id="lastModified"></p>
    </footer>

</html>
